<sap-page-header icon="🔐" title="Password Generator" description="Generate strong, random passwords." />

<div class="options">
  <label class="range-field">
    <span>Length: {{ length() }}</span>
    <input
      type="range"
      min="6"
      max="64"
      [ngModel]="length()"
      (ngModelChange)="length.set(+$event); generate()"
      name="length"
    />
  </label>

  <label class="checkbox">
    <input
      type="checkbox"
      [ngModel]="useLowercase()"
      (ngModelChange)="useLowercase.set($event); generate()"
      name="lowercase"
    />
    Lowercase (a-z)
  </label>

  <label class="checkbox">
    <input
      type="checkbox"
      [ngModel]="useUppercase()"
      (ngModelChange)="useUppercase.set($event); generate()"
      name="uppercase"
    />
    Uppercase (A-Z)
  </label>

  <label class="checkbox">
    <input
      type="checkbox"
      [ngModel]="useNumbers()"
      (ngModelChange)="useNumbers.set($event); generate()"
      name="numbers"
    />
    Numbers (0-9)
  </label>

  <label class="checkbox">
    <input
      type="checkbox"
      [ngModel]="useSymbols()"
      (ngModelChange)="useSymbols.set($event); generate()"
      name="symbols"
    />
    Symbols (!&#64;#…)
  </label>
</div>

<div class="output-row">
  <output class="password-output">{{ password() || '—' }}</output>
  <sap-button type="button" fillMode="flat" (clicked)="generate()">🔄 Generate</sap-button>
  <sap-button type="button" fillMode="outline" (clicked)="copy()">{{ copied() ? 'Copied!' : 'Copy' }}</sap-button>
</div>

<p class="strength {{ strength().className }}">Strength: {{ strength().label }}</p>
